[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "relayme"
version = "0.1.0"
description = "Minimal read-only remote compute and ops bridge"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only"
]

[project.scripts]
relayme-controller = "relayme.controller:main"
relayme-agent = "relayme.agent:main"
relayme = "relayme.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
