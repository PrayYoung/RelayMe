[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "relayme"
version = "0.4.0"
description = "Minimal remote operations bridge with bounded registered tasks and executor profiles"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=1.27,<2"]
license = {text = "Apache-2.0"}
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only"
]

[project.scripts]
relayme-controller = "relayme.controller:main"
relayme-agent = "relayme.agent:main"
relayme = "relayme.cli:main"
relayme-mcp = "adapters.mcp.server:main"

[tool.setuptools.packages.find]
include = ["relayme*", "adapters*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
