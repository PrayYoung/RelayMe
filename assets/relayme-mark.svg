<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <!-- Subtle circular backdrop -->
  <rect width="120" height="120" rx="28" fill="#0F172A" />
  
  <!-- Bridge / Connection line -->
  <path d="M 36 60 L 84 60" stroke="#334155" stroke-width="4" stroke-dasharray="4 3" />
  <path d="M 36 60 L 50 60" stroke="#6366F1" stroke-width="4" stroke-linecap="round" />
  <path d="M 70 60 L 84 60" stroke="#10B981" stroke-width="4" stroke-linecap="round" />

  <!-- Left Node: AI Agent (Indigo) -->
  <circle cx="34" cy="60" r="14" fill="#1E293B" stroke="#6366F1" stroke-width="3" />
  <!-- Agent prompt glyph ">" -->
  <path d="M 31 55 L 36 60 L 31 65" stroke="#A5B4FC" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Center: Protected Bridge / Gate (Shield & Relay) -->
  <path d="M 60 42 L 72 47 V 61 C 72 70 60 76 60 76 C 60 76 48 70 48 61 V 47 Z" fill="#1E1B4B" stroke="#818CF8" stroke-width="2.5" stroke-linejoin="round" />
  <!-- Relay keyhole / core -->
  <circle cx="60" cy="57" r="3" fill="#A5B4FC" />
  <path d="M 60 60 V 65" stroke="#A5B4FC" stroke-width="2" stroke-linecap="round" />

  <!-- Right Node: Remote Server / Compute (Emerald) -->
  <circle cx="86" cy="60" r="14" fill="#1E293B" stroke="#10B981" stroke-width="3" />
  <!-- Server stack bars -->
  <line x1="81" y1="56" x2="91" y2="56" stroke="#6EE7B7" stroke-width="2" stroke-linecap="round" />
  <line x1="81" y1="60" x2="91" y2="60" stroke="#6EE7B7" stroke-width="2" stroke-linecap="round" />
  <line x1="81" y1="64" x2="91" y2="64" stroke="#6EE7B7" stroke-width="2" stroke-linecap="round" />
</svg>
